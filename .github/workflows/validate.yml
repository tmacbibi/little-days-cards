name: Validate App
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check v06.js
      - name: Check DOM ids used by JavaScript
        run: |
          python - <<'PY'
          import re, sys
          js=open('v06.js',encoding='utf-8').read()
          html=open('index.html',encoding='utf-8').read()
          used=set(re.findall(r"\$\('([^']+)'\)",js))
          ids=set(re.findall(r'id="([^"]+)"',html))
          missing=sorted(used-ids)
          print("JS ids:",len(used),"HTML ids:",len(ids))
          if missing:
              print("Missing ids:",missing)
              sys.exit(1)
          PY
      - name: Verify required files
        run: |
          test -f index.html
          test -f app.js
          test -f v06.js
          test -f v06.css
          test -f manifest.webmanifest
          test -f sw.js
          test -f icons/icon-180.png
